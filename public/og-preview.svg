<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#0284C7" opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="480" r="300" fill="#2563EB" opacity="0.15" filter="blur(90px)" />

  <!-- Grid decoration lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Logo Badge -->
  <g transform="translate(120, 110)">
    <rect width="70" height="70" rx="18" fill="url(#glowGrad)" />
    <text x="35" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">RQ</text>
  </g>

  <!-- Available Tag -->
  <g transform="translate(210, 126)">
    <rect width="320" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="19" r="5" fill="#10B981" />
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">AVAILABLE FOR CLIENT PROJECTS</text>
  </g>

  <!-- Name & Professional Title -->
  <text x="120" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    Md Rahmatullah Quraishi
  </text>
  <text x="120" y="330" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="32" font-weight="700" fill="#38BDF8">
    Full Stack Developer • 2+ Years Experience
  </text>

  <!-- Tagline -->
  <text x="120" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">
    "Turning Ideas Into Powerful Digital Experiences."
  </text>
  <text x="120" y="425" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#64748B">
    React.js • Node.js • PHP • Laravel • MySQL • MongoDB • REST APIs
  </text>

  <!-- Bottom Details Bar -->
  <g transform="translate(120, 480)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#38BDF8">
      github.com/rahmatullahcodes
    </text>
    <text x="450" y="20" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#94A3B8">
      mdrahmatullahquraishi@gmail.com
    </text>
  </g>
</svg>
